name: Stage RPC release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stage
        required: true
        type: string
      publication:
        description: Prepare archives or stage for review
        type: choice
        default: stage
        options:
          - prepare
          - stage

permissions:
  contents: read

concurrency:
  group: publish-rpc
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Update npm CLI
        run: |
          npm install --global npm@11
          npm --version

      - name: Validate version and framework record
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION:-$(jq -er .version packages/spraxium/package.json)}"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          echo "number=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          node scripts/verify-framework.mjs

          for package in protocol client server spraxium; do
            jq -e --arg version "$RELEASE_VERSION" \
              '.version == $version' \
              "packages/$package/package.json"
          done

      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm check
          pnpm test:examples
          pnpm test:interop

      - name: Pack and verify release files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          archives="$RUNNER_TEMP/rpc-packages"

          mkdir -p "$archives"

          pnpm --filter './packages/*' -r pack \
            --pack-destination "$archives"

          for package in rpc-protocol rpc-client rpc-server rpc; do
            archive="$archives/spraxium-$package-$RELEASE_VERSION.tgz"

            tar -xOf "$archive" package/package.json | jq -e \
              --arg name "@spraxium/$package" \
              --arg version "$RELEASE_VERSION" \
              '.name == $name and .version == $version' >/dev/null

            tar -xOf "$archive" package/README.md >/dev/null
          done

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spraxium-rpc-${{ steps.version.outputs.number }}
          path: ${{ runner.temp }}/rpc-packages/*.tgz
          if-no-files-found: error

      - name: Test with the published framework
        if: inputs.publication != 'prepare'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          archives="$RUNNER_TEMP/rpc-packages"
          consumer="$RUNNER_TEMP/rpc-consumer"

          mkdir -p "$consumer"

          framework="$(jq -er '.version' compatibility/framework.json)"

          echo '{"private":true,"type":"module"}' > "$consumer/package.json"

          npm install --prefix "$consumer" --ignore-scripts --no-audit \
            "@spraxium/common@$framework" \
            "@spraxium/core@$framework" \
            "@spraxium/logger@$framework" \
            "@spraxium/env@$framework" \
            "$archives/spraxium-rpc-protocol-$RELEASE_VERSION.tgz" \
            "$archives/spraxium-rpc-client-$RELEASE_VERSION.tgz" \
            "$archives/spraxium-rpc-server-$RELEASE_VERSION.tgz" \
            "$archives/spraxium-rpc-$RELEASE_VERSION.tgz"

          cp packages/spraxium/test/fixtures/bot.mjs "$consumer/bot.mjs"

          RPC_FRAMEWORK_FIXTURE="$consumer/bot.mjs" pnpm test:framework

      - name: Stage packages in dependency order
        if: inputs.publication != 'prepare'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
        run: |
          registry() {
            local resource="$1" status

            status="$(curl --silent --show-error --retry 3 --output /dev/null \
              --write-out '%{http_code}' "https://registry.npmjs.org/$resource")" || exit 1

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::npm registry returned $status for $resource"; exit 1 ;;
            esac
          }

          stage() {
            local package="$1"
            local archive="$RUNNER_TEMP/rpc-packages/spraxium-$package-$RELEASE_VERSION.tgz"

            if registry "@spraxium%2f$package/$RELEASE_VERSION"; then
              echo "@spraxium/$package@$RELEASE_VERSION is already published."
            else
              npm stage publish "$archive" --tag latest --access public --provenance="$PUBLIC_REPOSITORY"
            fi
          }

          # Bootstrap a new package before any other package moves to the new version.
          if ! registry '@spraxium%2frpc-server'; then
            if ! stage rpc-server; then
              echo "::error::The first @spraxium/rpc-server publication needs npm scope credentials. Use the uploaded archive to stage it, then configure this workflow as its trusted publisher."
              exit 1
            fi

            echo "Approve @spraxium/rpc-server and configure its trusted publisher before submitting the rest of this release."
            exit 0
          fi

          for package in rpc-protocol rpc-client rpc-server rpc; do
            stage "$package"
          done
