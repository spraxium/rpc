name: Documentation
description: Report an unclear, missing or outdated example.
title: "[Docs] "
body:
  - type: input
    id: page
    attributes:
      label: Page or example
      description: Include the link and language if possible.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What needs to change?
    validations:
      required: true
