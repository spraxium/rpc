name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Validate commit messages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          else
            # A rewritten branch can lose its former tip from the checkout.
            commits="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
              const ids = (event.commits ?? []).map(({ id }) => id);
              console.log([...new Set(ids.length ? ids : [process.env.HEAD_SHA])].join("\n"));
            ')"
            while IFS= read -r commit; do
              if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$commit" "$HEAD_SHA"; then
                echo 'Push event contains a commit that is missing from the checked-out history.' >&2
                exit 1
              fi
              git show -s --format=%B "$commit" | pnpm exec commitlint --verbose
            done <<< "$commits"
          fi
