name: Question
description: Ask about installation, migration or using RPC.
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to do?
      description: Include your package versions and the part of the guide you are following.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Share only code and configuration with secrets removed.
