name: Framework compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      framework_repository:
        description: Framework repository containing the integration hooks (owner/repository)
        required: false
        default: spraxium/spraxium
        type: string
      framework_ref:
        description: Exact compatible framework tag or commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.target.outputs.repository }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - id: target
        name: Resolve the verified framework target
        env:
          INPUT_REPOSITORY: ${{ inputs.framework_repository }}
          INPUT_REF: ${{ inputs.framework_ref }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const target = JSON.parse(readFileSync('compatibility/framework.json', 'utf8'));
          const repository = process.env.INPUT_REPOSITORY || target.repository;
          const ref = process.env.INPUT_REF || target.ref || '';
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) throw new Error('Invalid framework repository.');
          if (ref && !/^[a-f0-9]{40}$/.test(ref)) throw new Error('Use an exact framework commit SHA.');
          appendFileSync(process.env.GITHUB_OUTPUT, `repository=${repository}\nref=${ref}\n`);
          if (!ref) appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'No compatible public framework release is recorded. Adapter publishing remains blocked by prepublishOnly. Run the local compatibility suite with the framework checkout.\n');
          JS

  integration:
    needs: target
    if: needs.target.outputs.ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rpc
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.target.outputs.repository }}
          ref: ${{ needs.target.outputs.ref }}
          path: framework
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        working-directory: rpc
      - name: Install framework dependencies with its pinned pnpm
        run: |
          framework_pnpm="$(node -p "require('./package.json').packageManager.split('@').at(-1)")"
          pnpm with "$framework_pnpm" install --frozen-lockfile
        working-directory: framework
      - run: pnpm test:framework --framework ../framework
        working-directory: rpc
